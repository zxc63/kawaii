# Render Blueprint для Karzen Business Bot
# Кладём в корень репозитория рядом с business_bot_mod.py
services:
  - type: web                 # именно web: у free-плана нет worker'ов
    name: karzen-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python business_bot_mod.py"
    healthCheckPath: /health  # Render перестанет искать порт и пинговать вслепую
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false           # задаёшь вручную в дашборде, в git не попадёт
      - key: WEBHOOK_SECRET
        generateValue: true   # Render сгенерит случайный
      - key: DATABASE_URL     # строка Neon (pooled endpoint + sslmode=require)
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
